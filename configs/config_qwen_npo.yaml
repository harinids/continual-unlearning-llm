auditor:
  eval_batch_size: 8
  forget_threshold: 0.3
  metrics:
  - exact_match
  - perplexity
  - membership_inference
  retain_threshold: 0.85
breaker:
  check_every_n_steps: 25
  emergency_lambda_multiplier: 1.5
  spike_multiplier: 3.0
controller:
  hard_drift_threshold: 3.0
  hard_stop_action: abort
  kd: 0.5
  ki: 0.1
  kp: 0.5
  max_rounds: 5
  patience: 2
  plasticity_init: 1.0
  stability_init: 1.0
  strategy: adaptive
dataset:
  cache_dir: ./data_cache
  eval_split: holdout
  forget_split: forget10
  name: tofu
  num_eval_samples: 200
  num_forget_samples: 200
  num_retain_samples: 500
  retain_split: retain90
device: cuda
ewc:
  enabled: true
  fisher_batch_size: 4
  fisher_num_samples: 200
  lambda_init: 1000.0
  lambda_max: 100000.0
  online: true
geometry:
  keep_ewc: false
  subspace_dim: 10
  subspace_samples: 16
logging:
  checkpoint_dir: ./outputs/checkpoints
  log_dir: ./outputs/logs
  output_dir: ./outputs
  save_every_round: true
  use_tensorboard: true
model:
  base_model: Qwen/Qwen2.5-0.5B
  lora:
    alpha: 16
    dropout: 0.05
    r: 8
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  max_length: 256
  use_lora: true
seed: 42
unlearning:
  batch_size: 4
  epochs: 4
  forget_loss_weight: 1.5
  grad_clip: 1.0
  lr: 2.0e-06
  method: npo
  retain_loss_weight: 1.0
